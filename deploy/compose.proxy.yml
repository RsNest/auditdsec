# Caddy in front of the panel, terminating TLS.
#
#   docker compose -f docker-compose.yml -f deploy/compose.proxy.yml up -d
#
# written for you by ./install.sh. Relative paths below resolve against the
# project directory, which is the directory of the FIRST -f file, so
# docker-compose.yml must come first on the command line.
#
# Which certificate is used depends on PANEL_CADDYFILE:
#
#   deploy/Caddyfile             a domain, certificate from Let's Encrypt,
#                                managed by Caddy itself (the default)
#   deploy/Caddyfile.acme-ip     a public IP address, certificate from
#                                Let's Encrypt, issued and renewed by the
#                                certbot container in compose.acme-ip.yml
#   deploy/Caddyfile.selfsigned  a certificate Caddy issues itself, for when
#                                neither of the above is possible
#
# The agent shares the host's network namespace so that Caddy, which also
# does, can reach it on 127.0.0.1 while that port stays off the wire. Caddy
# is the only process with a port open to the world.
services:
  auditdsec:
    network_mode: host
    environment:
      AUDITDSEC_WEB: "1"
      # The agent's own plain-HTTP upstream (loopback only). Not the public port.
      AUDITDSEC_WEB_LISTEN: 127.0.0.1:${PANEL_UPSTREAM_PORT:-${PANEL_PORT:-9477}}
      # What a person types: written by ./install.sh with the real public port.
      AUDITDSEC_WEB_PUBLIC_URL: ${PANEL_PUBLIC_URL:-https://${PANEL_SITE:-${PANEL_DOMAIN:?set PANEL_SITE in .env, or run ./install.sh}}}
      AUDITDSEC_WEB_PUBLIC_HTTPS_PORT: ${PANEL_HTTPS_PORT:-443}
      # What the agent watches in the certificate served at that link: verify
      # (chain and expiry), expiry (staging, self-signed, a private CA) or off.
      AUDITDSEC_WEB_CERT_CHECK: ${PANEL_CERT_CHECK:-verify}
      # Only Caddy, on loopback, may state the client's address.
      AUDITDSEC_WEB_TRUSTED_PROXIES: 127.0.0.1,::1

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10-alpine}
    container_name: auditdsec-caddy
    restart: unless-stopped
    network_mode: host
    depends_on: [auditdsec]
    cap_drop: ["ALL"]
    # Binding 80 and 443 is the one privilege it needs.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    environment:
      PANEL_SITE: ${PANEL_SITE:-${PANEL_DOMAIN:?set PANEL_SITE in .env, or run ./install.sh}}
      PANEL_EMAIL: ${PANEL_EMAIL:-}
      PANEL_SITE_ADDR: ${PANEL_SITE_ADDR:-${PANEL_SITE:-${PANEL_DOMAIN:-}}}
      PANEL_HTTPS_PORT: ${PANEL_HTTPS_PORT:-443}
      PANEL_UPSTREAM: 127.0.0.1:${PANEL_UPSTREAM_PORT:-${PANEL_PORT:-9477}}
      # Which ACME directory Caddy asks (domain mode), and the HSTS value. Both
      # are set by ./install.sh --staging and cleared by --production.
      PANEL_ACME_URL: ${PANEL_ACME_URL:-https://acme-v02.api.letsencrypt.org/directory}
      PANEL_HSTS: ${PANEL_HSTS:-max-age=31536000}
      # Only for a private ACME server; empty means the normal trust store.
      SSL_CERT_FILE: ${PANEL_ACME_CA_ROOT:+/acme-ca.pem}
    volumes:
      - ${PANEL_CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      # Certificates from the certbot container, used only by Caddyfile.acme-ip.
      - panel-certs${PANEL_ACME_SUFFIX:-}:/certs:ro
      # Caddy's own certificates and account key. Losing this volume means
      # asking Let's Encrypt for a new certificate, which is rate limited.
      # Staging and production use separate ones (PANEL_ACME_SUFFIX).
      - caddy-data${PANEL_ACME_SUFFIX:-}:/data
      - caddy-config${PANEL_ACME_SUFFIX:-}:/config
      - caddy-logs:/var/log/caddy
      - ${PANEL_ACME_CA_ROOT:-/dev/null}:/acme-ca.pem:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-data-staging:
  caddy-config:
  caddy-config-staging:
  caddy-logs:
  panel-certs:
  panel-certs-staging:
