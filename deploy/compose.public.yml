# Publish the panel on the internet over HTTPS.
#
#   docker compose -f docker-compose.yml -f deploy/compose.public.yml up -d --build
#
# with the enforcing agent as well:
#
#   docker compose -f docker-compose.yml -f deploy/compose.enforce.yml \
#                  -f deploy/compose.public.yml up -d --build
#
# What you need first:
#
#   1. A domain or subdomain with an A record pointing at this server, and
#      ports 80 and 443 open. Let's Encrypt has to reach port 80 to issue the
#      certificate.
#   2. PANEL_DOMAIN, PANEL_EMAIL and a password in .env. Make the hash with
#        docker compose run --rm --entrypoint /usr/local/bin/auditdsec \
#          auditdsec hash-password
#      and put it in AUDITDSEC_WEB_PASSWORD_HASH.
#
# How it is put together, and why:
#
#   caddy          terminates TLS and gets the certificate itself; it is the
#                  only container with a published port
#   network_mode   both containers share the host's network namespace, so the
#     host         panel port stays on 127.0.0.1 where nothing outside the
#                  machine can reach it, and Caddy still finds it
#   trusted
#     proxies      only a request coming from loopback — that is, from Caddy —
#                  has its X-Forwarded-For believed, so a visitor cannot forge
#                  the address the sign-in limiter counts
#
# Without a domain, do not use this file: forward the port over SSH instead,
#   ssh -L 9477:127.0.0.1:9477 root@your-server
# and open http://127.0.0.1:9477 on your own machine.
services:
  auditdsec:
    # The panel must stay on loopback. Caddy is the only way in.
    network_mode: host
    environment:
      AUDITDSEC_WEB: "1"
      AUDITDSEC_WEB_LISTEN: 127.0.0.1:9477
      AUDITDSEC_WEB_LOGIN: ${AUDITDSEC_WEB_LOGIN:-admin}
      AUDITDSEC_WEB_PASSWORD_HASH: ${AUDITDSEC_WEB_PASSWORD_HASH:?run `auditdsec hash-password` and put the result in .env}
      AUDITDSEC_WEB_TRUSTED_PROXIES: 127.0.0.1,::1

  caddy:
    image: caddy:2.9-alpine
    container_name: auditdsec-caddy
    restart: unless-stopped
    network_mode: host
    depends_on: [auditdsec]
    cap_drop: ["ALL"]
    # Binding 80 and 443 is the one privilege it needs.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 128
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?set PANEL_DOMAIN in .env}
      PANEL_EMAIL: ${PANEL_EMAIL:?set PANEL_EMAIL in .env}
      PANEL_UPSTREAM: 127.0.0.1:9477
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificate and the account key. Losing this volume means asking
      # Let's Encrypt for a new certificate, which is rate limited.
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
