# auditdsec: reads the host's audit log read-only and reports to Telegram.
#
# Quick start:
#   cp .env.example .env     # put the token and the chat id there
#   docker compose up -d
#
# The container needs no privileges: it only reads /var/log/audit.
#
# With the web panel, ./install.sh chooses extra files (the proxy, the host
# network, certbot, blocking, the control link) and saves the whole list as
# COMPOSE_FILE in .env, so `docker compose up -d` in this directory keeps that
# setup. Do not start such an installation with this file alone: the agent
# would come up in a bridge network and the proxy would answer 502.
services:
  auditdsec:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: minimal
      args:
        VERSION: ${AUDITDSEC_VERSION:-dev}
        COMMIT: ${AUDITDSEC_COMMIT:-none}
    # The published image for this exact commit, written by ./install.sh, e.g.
    # ghcr.io/rsnest/auditdsec:sha-<40 hex>. Built locally only with
    # ./install.sh --build-local, which sets a local tag instead.
    image: ${AUDITDSEC_IMAGE:-auditdsec:local}
    # Never build implicitly: the installer pulls (or, in the developer mode,
    # builds) before `up`, and runs `up --no-build`.
    pull_policy: missing
    container_name: auditdsec
    restart: unless-stopped

    # Hardening: nothing is writable except the state volume, no capabilities,
    # no privilege escalation, and a hard memory ceiling.
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64

    environment:
      AUDITDSEC_TG_TOKEN: ${AUDITDSEC_TG_TOKEN:?set AUDITDSEC_TG_TOKEN in .env}
      AUDITDSEC_TG_CHAT_ID: ${AUDITDSEC_TG_CHAT_ID:?set AUDITDSEC_TG_CHAT_ID in .env}
      AUDITDSEC_PROFILE: ${AUDITDSEC_PROFILE:-simple}
      AUDITDSEC_LANG: ${AUDITDSEC_LANG:-ru}
      AUDITDSEC_HOST: ${AUDITDSEC_HOST:-}
      AUDITDSEC_LOG_LEVEL: ${AUDITDSEC_LOG_LEVEL:-info}
      TZ: ${TZ:-UTC}

      # The web panel. Off unless AUDITDSEC_WEB=1, and it refuses to start
      # without a password. ./install.sh writes these; the overlay files in
      # deploy/ set the ones that depend on how the panel is published.
      AUDITDSEC_WEB: ${AUDITDSEC_WEB:-}
      AUDITDSEC_WEB_LISTEN: ${AUDITDSEC_WEB_LISTEN:-}
      AUDITDSEC_WEB_LOGIN: ${AUDITDSEC_WEB_LOGIN:-}
      # The hash, never the password. Values from .env are passed through
      # unchanged, so the $ signs inside it need no escaping.
      AUDITDSEC_WEB_PASSWORD_HASH: ${AUDITDSEC_WEB_PASSWORD_HASH:-}
      AUDITDSEC_WEB_PUBLIC_URL: ${AUDITDSEC_WEB_PUBLIC_URL:-}
      AUDITDSEC_WEB_TRUSTED_PROXIES: ${AUDITDSEC_WEB_TRUSTED_PROXIES:-}

    volumes:
      - /var/log/audit:/var/log/audit:ro
      - auditdsec-state:/var/lib/auditdsec
      # The central log directory of the whole installation (see docs/LOGS.md).
      # root:root 0750 on the host; the installer creates it. Nothing serves it.
      - ${AUDITSEC_LOG_DIR:-/var/log/auditseclogs}:/var/log/auditseclogs
      # Inside a container the host name is the container id, which would label
      # every alert with a hex blob. This lets the agent read the real one.
      - /etc/hostname:/etc/host-hostname:ro
      # Uncomment to use a configuration file instead of variables:
      # - ./auditdsec.yaml:/etc/auditdsec/auditdsec.yaml:ro

    # "Running" does not mean the panel works. This asks the agent's own web
    # server (the binary does it: the minimal image has no curl or shell). It
    # cannot see a proxy that waits for an address this container is not on;
    # the installer checks that from outside, see docs/ARCHITECTURE.md.
    healthcheck:
      test: ["CMD", "/usr/local/bin/auditdsec", "healthcheck"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s

    # The agent rotates its own log file; this caps Docker's copy of stdout.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auditdsec-state:
