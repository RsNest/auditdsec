# auditdsec configuration.
#
# Every setting here has a sensible default, so a minimal file is just the two
# Telegram lines — and even those are better supplied as environment variables
# (AUDITDSEC_TG_TOKEN, AUDITDSEC_TG_CHAT_ID) so no secret lands in git.
#
# Environment variables override this file. The parser accepts the YAML subset
# used below: nested keys by indentation, scalars, lists and # comments.

# simple — one VPS: only important alerts (warn and above), 14 days of history.
# pro    — several servers: every event, 90 days, more messages per minute.
profile: simple

# ru or en. Russian is the default.
lang: ru

# Name shown in the alerts. Empty uses the system host name.
host: ""

audit_log: /var/log/audit/audit.log
state_dir: /var/lib/auditdsec

# Read the existing log on the very first start. Off by default, so installing
# the agent does not replay months of history into the chat.
read_from_start: false

# Debug mode: log every line read, the reason every record was ignored and the
# decision behind every alert, plus the counters every 30 seconds. It answers
# "why did no alert arrive". Off by default; it also raises log.level to debug
# on its own. AUDITDSEC_DEBUG=1 and `auditdsec run -debug` do the same thing,
# and the /debug command in the chat reports which state it is in.
debug: false

log:
  file: /var/log/auditdsec/auditdsec.log
  level: info          # debug, info, warn, error
  max_size_mb: 10
  max_backups: 3
  stdout: true

telegram:
  # Better set through AUDITDSEC_TG_TOKEN.
  token: ""
  # Chats allowed to use the bot. The bot answers nobody else, and refuses to
  # start when this list is empty.
  chat_ids: []
  api_base: https://api.telegram.org
  # Alert from this severity up: info, warn or critical. Events below it are
  # still recorded and visible through /last.
  min_severity: warn
  # Identical events inside this window become one message plus a count.
  dedup_window: 10m
  rate_per_minute: 10
  # Hold back non-critical alerts at night. Critical events always come
  # through. Set both or neither.
  quiet_from: ""       # "23:00"
  quiet_to: ""         # "08:00"
  # Say hello on start; this is also how you learn the token works.
  startup_notice: true

store:
  retention_days: 14
  max_recent: 200

# Notices when the audit log stops being written. Silence from a compromised
# host looks exactly like silence from a quiet one, which is why this exists.
heartbeat:
  enabled: true
  stale_after: 6h
  check_every: 1m

# Brute-force detector. Counts failed logins per source address over a sliding
# window and bans the address when the threshold is reached.
detect:
  enabled: true
  window: 10m
  fail_threshold: 10
  # How many failures from one address make a later success from it suspicious.
  # That success is the signal that matters most — it is what a guessed
  # password looks like — and it is reported as critical. Zero switches it off.
  success_after_failures: 10
  # Cap on addresses remembered, so a spray from thousands of sources cannot
  # grow the agent's memory.
  max_tracked: 10000

# What happens to a ban decision.
ban:
  # none     — record and report the decision, change nothing on the host.
  #            The default, because the container runs with every capability
  #            dropped and cannot touch the firewall.
  # nftables — actually block the address. Needs NET_ADMIN and the host network
  #            namespace: see deploy/compose.enforce.yml, or run the binary
  #            install as root. Everything lives in the agent's own
  #            "inet auditdsec" table, so your firewall is not touched.
  backend: none
  # Log the exact nft command instead of running it. Worth a try first: the
  # failure mode of this feature is locking yourself out.
  dry_run: false
  table: auditdsec
  # first_login — protect the source of the first successful login after the
  #               agent starts, which is almost always the person installing
  #               it. This is what stops the detector banning its own owner.
  # off         — no automatic protection; use /allow instead.
  auto_allowlist: first_login

# CrowdSec integration — arrives in v0.3.
crowdsec:
  enabled: false
  mode: push           # push, pull or both
  lapi_url: http://127.0.0.1:8080
  api_key: ""
